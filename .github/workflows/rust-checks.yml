name: Rust checks

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rust-checks.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"

permissions:
  contents: read

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - run: rustup component add rustfmt clippy llvm-tools-preview --toolchain stable
      - run: cargo +stable install cargo-llvm-cov --version 0.9.2 --locked
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable llvm-cov --workspace --locked --fail-under-lines 100 --fail-under-functions 100 --show-missing-lines
