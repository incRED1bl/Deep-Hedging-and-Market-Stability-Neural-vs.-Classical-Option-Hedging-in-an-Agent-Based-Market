# AI assistance: OpenAI ChatGPT, 2026-11-27 (initial repository scaffold).
[project]
name = "finmath-abm"
version = "0.1.0"
description = "Neural and classical option hedging in an agent-based financial market."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = []

[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[dependency-groups]
# Installed by default for local development and the CPU-only CI checks.
dev = [
    { include-group = "release" },
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
# NPZ replay validation for the packager and download verifier.
release = ["numpy>=2.5.5"]
# Opt in with `uv sync --group kaggle` or `uv run --group kaggle kaggle ...`.
# The CLI is a submission/download tool; it is not part of the simulation runtime.
kaggle = [
    "kaggle>=2.2.5",
    # Kaggle 2.2.5 imports six without declaring it; python-dateutil 4 no longer supplies it.
    "six>=1.17.0",
]

[tool.uv]
required-version = "==0.13.9"
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "finmath"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
